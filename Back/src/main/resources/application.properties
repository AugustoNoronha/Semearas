spring.application.name=semearas-back
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/semearas}
spring.datasource.username=${DATABASE_USER:semearas}
spring.datasource.password=${DATABASE_PASSWORD}
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=true
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=semearas
app.jwt.ttl-seconds=900
app.cors.origins=${CORS_ORIGINS:http://localhost:8082,http://localhost:8081,http://localhost:19006,http://127.0.0.1:8081,http://127.0.0.1:8082}
